<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutMundi - Crypto Football Gaming</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #ff007f;
            --dark-bg: #0d0e15;
            --card-bg: #1a1c28;
            --text: #ffffff;
            --text-muted: #8f94a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 10%, #1e1b4b 0%, var(--dark-bg) 70%);
            min-height: 100vh;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 80px;
        }

        /* Header */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--primary);
        }

        .user-info .username {
            font-weight: bold;
            font-size: 14px;
        }

        .user-info .rank {
            font-size: 11px;
            color: var(--primary);
        }

        .stats-container {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .stat-box.gems { border-color: rgba(0, 255, 204, 0.2); color: var(--primary); }
        .stat-box.usdt { border-color: rgba(255, 0, 127, 0.2); color: var(--secondary); }

        /* Main Content Tabs */
        .tab-content {
            display: none;
            padding: 20px;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards & UI Elements */
        .balance-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,255,204,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .balance-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
        }

        /* Form Controls */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-control {
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-control:focus {
            border-color: var(--primary);
        }

        .btn {
            background: linear-gradient(90deg, var(--primary), #00ccff);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            display: inline-block;
            text-align: center;
            text-decoration: none;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn:disabled {
            background: #4a4d5a;
            color: #8f94a5;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Navigation Menu Bar */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(26, 28, 40, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            animation: modalSlideUp 0.3s ease;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="user-profile">
                <div class="avatar" id="userAvatar">U</div>
                <div class="user-info">
                    <div class="username" id="userNameDisplay">Cargando...</div>
                    <div class="rank">Manager Novato</div>
                </div>
            </div>
            <div class="stats-container">
                <div class="stat-box gems">
                    💎 <span id="userGems">0</span>
                </div>
            </div>
        </header>

        <div id="wallet-tab" class="tab-content active">
            <div class="balance-card">
                <div class="balance-title">Balance de mi Club</div>
                <div class="balance-amount"><span id="walletGemsDisplay">0</span> 💎</div>
                <button class="btn" onclick="abrirModalRetirar()">Retirar a mi Wallet (USDT)</button>
            </div>
        </div>

        <div id="game-tab" class="tab-content">
            <div class="balance-card">
                <div class="modal-title">Estadio de FutMundi</div>
                <p style="color: var(--text-muted); font-size: 14px;">Próximamente podrás jugar partidos rápidos utilizando tus cartas chibi NFT de colección.</p>
            </div>
        </div>

        <div id="modalRetirar" class="modal">
            <div class="modal-content">
                <button class="modal-close" onclick="cerrarModalRetirar()">×</button>
                <div class="modal-title">Retirar Fondos</div>
                <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Convierte tus gemas internas directamente a USDT en la red TON.</p>
                
                <div class="input-group">
                    <label for="walletInput">Dirección de Wallet TON Destino</label>
                    <input type="text" id="walletInput" class="input-control" placeholder="EQ... o UQ...">
                </div>

                <div class="input-group">
                    <label for="gemasInput">Cantidad de Gemas a Retirar</label>
                    <input type="number" id="gemasInput" class="input-control" placeholder="Ej. 500" min="1">
                </div>

                <button id="confirmarRetiroBtn" class="btn">Confirmar Retiro</button>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active" onclick="switchTab('wallet-tab', this)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>Billetera</span>
            </div>
            <div class="nav-item" onclick="switchTab('game-tab', this)">
                <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>Juego</span>
            </div>
        </nav>
    </div>

    <script>
        // Inicialización de Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Variables de estado local del usuario
        let tgId = 123456789; // ID fallback por si se abre fuera de Telegram
        let userGems = 0;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgId = tg.initDataUnsafe.user.id;
            document.getElementById('userNameDisplay').innerText = tg.initDataUnsafe.user.first_name || "Manager";
            if (tg.initDataUnsafe.user.first_name) {
                document.getElementById('userAvatar').innerText = tg.initDataUnsafe.user.first_name.charAt(0).toUpperCase();
            }
        }

        // Simulación de carga inicial (Aquí llamarías a tu API de perfil para traer las gemas reales)
        function loadUserDataMock() {
            userGems = 1500; // Saldo de prueba inicial
            actualizarInterfazGemas();
        }

        function actualizarInterfazGemas() {
            document.getElementById('userGems').innerText = userGems;
            document.getElementById('walletGemsDisplay').innerText = userGems;
        }

        // Control de Pestañas
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // Control de Modales
        function abrirModalRetirar() {
            document.getElementById('modalRetirar').style.display = 'flex';
        }

        function cerrarModalRetirar() {
            document.getElementById('modalRetirar').style.display = 'none';
        }

        // ==========================================
        // LA SECCIÓN CORREGIDA DEL RETIRO (CONECTADA A /api/retiro)
        // ==========================================
        async function retirarGemas() {
            const walletInput = document.getElementById('walletInput');
            const gemasInput = document.getElementById('gemasInput');
            
            const walletAddress = walletInput ? walletInput.value.trim() : '';
            const gemasARetirar = gemasInput ? parseInt(gemasInput.value, 10) : 0;

            if (!walletAddress) {
                alert('Por favor, ingresa una dirección de billetera válida.');
                return;
            }
            if (isNaN(gemasARetirar) || gemasARetirar <= 0) {
                alert('Ingresa una cantidad válida de gemas a retirar.');
                return;
            }
            if (gemasARetirar > userGems) {
                alert('No tienes suficientes gemas para realizar este retiro.');
                return;
            }

            const confirmarBtn = document.getElementById('confirmarRetiroBtn');

            try {
                if (confirmarBtn) {
                    confirmarBtn.disabled = true;
                    confirmarBtn.innerText = 'Procesando...';
                }

                // Llamada directa y real al backend de Vercel
                const response = await fetch('/api/retiro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: tgId,
                        walletAddress: walletAddress,
                        gemasARetirar: gemasARetirar
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Error en el servidor al procesar el retiro.');
                }

                // Modificamos el estado local únicamente si la base de datos confirmó el descuento
                userGems = data.gemasRestantes;
                actualizarInterfazGemas();

                alert(`¡Retiro registrado con éxito!\nID de Operación: ${data.retiroId}\nLas gemas restantes se han actualizado.`);
                cerrarModalRetirar();

            } catch (error) {
                alert(`Error al procesar el retiro: ${error.message}`);
            } finally {
                if (confirmarBtn) {
                    confirmarBtn.disabled = false;
                    confirmarBtn.innerText = 'Confirmar Retiro';
                }
            }
        }

        // Eventos al cargar el DOM
        document.addEventListener('DOMContentLoaded', () => {
            loadUserDataMock();

            const confirmarBtn = document.getElementById('confirmarRetiroBtn');
            if (confirmarBtn) {
                confirmarBtn.onclick = (e) => {
                    e.preventDefault();
                    retirarGemas();
                };
            }
        });
    </script>
</body>
</html>

<div class="modal-overlay broadcast-modal" id="modal-duelo-urbano">
    <div class="modal bcast-volumetric-bg" style="background:transparent; box-shadow:none; padding:0; height:100%;">
        <div class="broadcast-header" style="border-bottom:1px solid #4CAF50;">
            <span class="modal-title" style="color:#4CAF50;">🏟️ FUTCANCHA</span>
            <button class="broadcast-close" onclick="closeModal('modal-duelo-urbano')">✕</button>
        </div>
        
        <div class="fc-hero">
            <img src="./assets/estadio_principal.png" alt="Estadio" class="bcast-render-3d">
            <div class="fc-hero-overlay"></div>
        </div>

        <div class="torneo-section-title" style="margin-top:10px; margin-bottom:5px;">💎 GANANCIAS POR PARTIDO</div>
        
        <div class="fc-wld-row">
            <div class="fc-wld-card win bcast-reward-win" style="border:none;">
                <div style="font-size:1.5em; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🏆</div>
                <div class="fc-wld-title">Victoria</div>
                <div class="fc-wld-val tactical-font" id="pvp-win-gems">0 💎</div>
            </div>
            <div class="fc-wld-card draw bcast-reward-draw" style="border:none;">
                <div style="font-size:1.5em; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">🤝</div>
                <div class="fc-wld-title">Empate</div>
                <div class="fc-wld-val tactical-font" id="pvp-draw-gems" style="color:#FFD700">0 💎</div>
            </div>
            <div class="fc-wld-card loss bcast-reward-loss" style="border:none;">
                <div style="font-size:1.5em; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5));">❌</div>
                <div class="fc-wld-title">Derrota</div>
                <div class="fc-wld-val tactical-font" style="color:#fff">0 💎</div>
            </div>
        </div>

        <div class="fc-mode-card bcast-metal-plate" onclick="abrirSeleccionJugadorPVP('liga')">
            <img src="./assets/estadio_liga.png" class="fc-mode-img" alt="Liga Mundial">
            <div class="fc-mode-info">
                <div style="display:flex; flex-direction:column;">
                    <div class="fc-mode-name">LIGA MUNDIAL</div>
                </div>
            </div>
        </div>

        <div class="fc-mode-card bcast-metal-plate" style="border-color:#FFD700; background:linear-gradient(180deg, #2a220a 0%, #151105 100%);" onclick="abrirSeleccionJugadorPVP('amistoso')">
            <img src="./assets/estadio_principal.png" style="opacity:0.3;" class="fc-mode-img" alt="Amistoso">
            <img src="./assets/balon_retro.png" class="fc-mode-icon" alt="Balon Retro">
            <div class="fc-mode-info">
                <div style="display:flex; flex-direction:column;">
                    <div class="fc-mode-name" style="color:#FFD700;">PARTIDO AMISTOSO</div>
                </div>
            </div>
        </div>

        <div style="height:20px;"></div>
    </div>
</div>
